<div class="container mt-5">
  <h2>Listado de Usuarios</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Email</th>
        <th>Nombre</th>
        <th>Contraseña</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios">
        <td>{{ usuario.email }}</td>
        <td>{{ usuario.nombre }}</td>
        <td>{{ usuario.pwd }}</td>
      </tr>
    </tbody>
  </table>
</div>
